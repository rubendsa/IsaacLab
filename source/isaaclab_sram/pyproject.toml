[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_sram"
version = "0.1.0"
description = "SRAM-oriented RL experiments: persistent Cartpole training and fused native Kuka-Allegro camera PPO operations."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "rl", "learning", "cuda", "megakernel"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab_rl",
    "isaaclab_tasks",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_rl = { path = "../isaaclab_rl", editable = true }
isaaclab_tasks = { path = "../isaaclab_tasks", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_sram", "isaaclab_sram.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
# The megakernel is compiled from source at runtime with NVRTC.
"isaaclab_sram" = ["kernels/*.cu", "kernels/*.cuh"]
